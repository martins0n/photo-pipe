[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-pipe"
version = "0.1.0"
description = "End-to-end raw photo pipeline: raw -> DxO PureRAW -> YAML film-sim recipe -> JPEG"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "martins0n" }]
keywords = ["photography", "raw", "dxo", "pureraw", "film-simulation", "fuji", "sony"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

dependencies = [
    "numpy>=1.21",
    "opencv-python>=4.5",
    "rawpy>=0.17",
    "Pillow>=9.0",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
# Only the Creative Look solver needs SciPy; the pipeline itself does not.
fit = ["scipy>=1.7"]
dev = ["pytest>=7.0", "scipy>=1.7"]

[project.scripts]
photo-pipe = "photopipe.cli:main"

[project.urls]
Homepage = "https://github.com/martins0n/photo-pipe"
Issues = "https://github.com/martins0n/photo-pipe/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photopipe = ["recipes/*.yaml", "recipes/*.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
